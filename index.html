<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌡️ 积温可视化面板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #eee;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2.5em;
      background: linear-gradient(90deg, #ff6b6b, #feca57);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      transition: transform 0.2s;
    }
    .stat-card:hover {
      transform: translateY(-5px);
    }
    .stat-label {
      font-size: 0.9em;
      color: #888;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 2em;
      font-weight: bold;
    }
    .stat-bar {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }
    .stat-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    .connection .stat-fill { background: linear-gradient(90deg, #ff6b6b, #ee5a5a); }
    .pride .stat-fill { background: linear-gradient(90deg, #4ecdc4, #44a3aa); }
    .valence .stat-fill { background: linear-gradient(90deg, #feca57, #ff9f43); }
    .arousal .stat-fill { background: linear-gradient(90deg, #a29bfe, #6c5ce7); }
    .immersion .stat-fill { background: linear-gradient(90deg, #55efc4, #00b894); }
    
    .chart-container {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .chart-title {
      font-size: 1.1em;
      margin-bottom: 15px;
      color: #aaa;
    }
    canvas {
      width: 100%;
      height: 200px;
    }
    
    .status-text {
      text-align: center;
      padding: 15px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 1.1em;
      color: #feca57;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95em;
      transition: transform 0.2s, opacity 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    button:active {
      transform: translateY(0);
    }
    button.primary {
      background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
    }
    button.success {
      background: linear-gradient(135deg, #55efc4, #00b894);
    }
    
    .log {
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 15px;
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85em;
      color: #888;
    }
    .log-entry {
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .log-entry:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌡️ 积温可视化面板</h1>
    <p class="subtitle">AI角色主动意识引擎 - 数值监控</p>
    
    <div class="status-text" id="statusText">等待连接...</div>
    
    <div class="stats-grid">
      <div class="stat-card connection">
        <div class="stat-label">连接需求 (Connection)</div>
        <div class="stat-value" id="connectionValue">0.00</div>
        <div class="stat-bar"><div class="stat-fill" id="connectionBar" style="width:0%"></div></div>
      </div>
      <div class="stat-card pride">
        <div class="stat-label">骄傲 (Pride)</div>
        <div class="stat-value" id="prideValue">0.00</div>
        <div class="stat-bar"><div class="stat-fill" id="prideBar" style="width:50%"></div></div>
      </div>
      <div class="stat-card valence">
        <div class="stat-label">愉悦度 (Valence)</div>
        <div class="stat-value" id="valenceValue">0.00</div>
        <div class="stat-bar"><div class="stat-fill" id="valenceBar" style="width:50%"></div></div>
      </div>
      <div class="stat-card arousal">
        <div class="stat-label">唤醒度 (Arousal)</div>
        <div class="stat-value" id="arousalValue">0.00</div>
        <div class="stat-bar"><div class="stat-fill" id="arousalBar" style="width:50%"></div></div>
      </div>
      <div class="stat-card immersion">
        <div class="stat-label">沉浸度 (Immersion)</div>
        <div class="stat-value" id="immersionValue">0.00</div>
        <div class="stat-bar"><div class="stat-fill" id="immersionBar" style="width:0%"></div></div>
      </div>
    </div>
    
    <div class="chart-container">
      <div class="chart-title">📈 数值变化趋势</div>
      <canvas id="chart"></canvas>
    </div>
    
    <div class="controls">
      <button onclick="tick()">⏱️ Tick 5分钟</button>
      <button class="primary" onclick="applyDelta({connection: -0.3})">💬 聊天后重置</button>
      <button class="success" onclick="applyDelta({pride: -0.1, valence: 0.1})">😊 被夸了</button>
      <button onclick="applyDelta({valence: -0.2})">😔 心情不好</button>
      <button onclick="setActivity()">📖 开始做事</button>
      <button onclick="resetAll()">🔄 重置全部</button>
    </div>
    
    <div class="chart-container">
      <div class="chart-title">📋 日志</div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    // 积温状态
    let state = {
      connection: 0,
      pride: 0,
      valence: 0,
      arousal: 0,
      immersion: 0
    };
    
    let history = {
      connection: [],
      pride: [],
      valence: [],
      arousal: [],
      immersion: []
    };
    
    const MAX_HISTORY = 50;
    
    function updateDisplay() {
      document.getElementById('connectionValue').textContent = state.connection.toFixed(2);
      document.getElementById('prideValue').textContent = state.pride.toFixed(2);
      document.getElementById('valenceValue').textContent = state.valence.toFixed(2);
      document.getElementById('arousalValue').textContent = state.arousal.toFixed(2);
      document.getElementById('immersionValue').textContent = state.immersion.toFixed(2);
      
      document.getElementById('connectionBar').style.width = (state.connection * 100) + '%';
      document.getElementById('prideBar').style.width = ((state.pride + 1) / 2 * 100) + '%';
      document.getElementById('valenceBar').style.width = ((state.valence + 1) / 2 * 100) + '%';
      document.getElementById('arousalBar').style.width = ((state.arousal + 1) / 2 * 100) + '%';
      document.getElementById('immersionBar').style.width = (state.immersion * 100) + '%';
      
      updateStatusText();
      drawChart();
    }
    
    function updateStatusText() {
      let text = '';
      if (state.connection >= 0.5) {
        text = '😤 坐不住了！必须联系！';
      } else if (state.connection >= 0.35 && state.pride < 0.5) {
        text = '🤔 想开口，但还在犹豫...';
      } else if (state.connection >= 0.35 && state.pride >= 0.5) {
        text = '😤 想联系但嘴硬，找事做';
      } else if (state.valence < -0.3) {
        text = '😔 心情不太好，想自己待着';
      } else if (state.arousal > 0.5) {
        text = '😰 有点焦躁，需要宣泄';
      } else if (state.connection > 0.2) {
        text = '👀 注意到沉默了...';
      } else {
        text = '😌 状态平稳';
      }
      document.getElementById('statusText').textContent = text;
    }
    
    function addHistory() {
      Object.keys(history).forEach(key => {
        history[key].push(state[key]);
        if (history[key].length > MAX_HISTORY) {
          history[key].shift();
        }
      });
    }
    
    function drawChart() {
      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = 200;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const colors = {
        connection: '#ff6b6b',
        pride: '#4ecdc4',
        valence: '#feca57',
        arousal: '#a29bfe',
        immersion: '#55efc4'
      };
      
      Object.keys(history).forEach(key => {
        if (history[key].length < 2) return;
        
        ctx.beginPath();
        ctx.strokeStyle = colors[key];
        ctx.lineWidth = 2;
        
        const step = canvas.width / (MAX_HISTORY - 1);
        const startX = canvas.width - (history[key].length - 1) * step;
        
        history[key].forEach((val, i) => {
          const x = startX + i * step;
          let y = canvas.height - (val + 1) / 2 * canvas.height;
          
          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        });
        
        ctx.stroke();
      });
      
      let legendX = 10;
      Object.keys(colors).forEach(key => {
        ctx.fillStyle = colors[key];
        ctx.fillRect(legendX, 10, 15, 15);
        ctx.fillStyle = '#eee';
        ctx.font = '12px sans-serif';
        ctx.fillText(key, legendX + 20, 22);
        legendX += 80;
      });
    }
    
    function tick() {
      addHistory();
      
      // 模拟积温漂移
      state.connection = Math.min(1, state.connection + 0.02);
      state.pride = Math.max(-1, Math.min(1, state.pride + (Math.random() - 0.5) * 0.02));
      state.valence = Math.max(-1, Math.min(1, state.valence + (Math.random() - 0.5) * 0.02));
      state.arousal = Math.max(-1, Math.min(1, state.arousal + (Math.random() - 0.5) * 0.02));
      state.immersion = Math.max(0, state.immersion - 0.01);
      
      updateDisplay();
      log('⏱️ Tick 5分钟');
    }
    
    function applyDelta(delta) {
      Object.keys(delta).forEach(key => {
        if (state.hasOwnProperty(key)) {
          state[key] = Math.max(-1, Math.min(1, state[key] + delta[key]));
        }
      });
      addHistory();
      updateDisplay();
      log('📊 应用变化: ' + JSON.stringify(delta));
    }
    
    function setActivity() {
      state.immersion = Math.min(1, state.immersion + 0.5);
      state.connection = Math.max(0, state.connection - 0.2);
      addHistory();
      updateDisplay();
      log('📖 开始做事，沉浸度提升');
    }
    
    function resetAll() {
      state = { connection: 0, pride: 0, valence: 0, arousal: 0, immersion: 0 };
      addHistory();
      updateDisplay();
      log('🔄 重置全部状态');
    }
    
    function log(msg) {
      const logEl = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.textContent = new Date().toLocaleTimeString() + ' ' + msg;
      logEl.insertBefore(entry, logEl.firstChild);
      
      if (logEl.children.length > 50) {
        logEl.removeChild(logEl.lastChild);
      }
    }
    
    // 初始化
    updateDisplay();
    log('🌡️ 积温可视化面板已启动');
    
    // 自动tick
    setInterval(tick, 30000);
  </script>
</body>
</html>
